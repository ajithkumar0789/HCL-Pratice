<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Bill Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form>
        <h2>Shop</h2>
        <div class="input-grid">
            
            <div>
                <label>Rice</label> 
                <input id="e1" min="0" type="number" placeholder="Quantity">
            </div>
            
            <div>
                <label>Wheat</label>
                <input id="e2" min="0" type="number" placeholder="Quantity">
            </div>
            
            <div>
                <label>Milk</label>
                <input id="e3" min="0" type="number" placeholder="Quantity">
            </div>
            
            <div>
                <label>Paste</label>
                <input id="e4" min="0" type="number" placeholder="Quantity">
            </div>
            
            <div>
                <label>Brush</label>
                <input id="e5" min="0" type="number" placeholder="Quantity">
            </div>
            
            <div>
                <label>Juice pack</label>
                <input id="e6" min="0" type="number" placeholder="Quantity">
            </div>
            
            <div>
                <label>Cookies</label>
                <input id="e7" min="0" type="number" placeholder="Quantity">
            </div>
            
            <div>
                <label>Chocolates</label>
                <input id="e8" min="0" type="number" placeholder="Quantity">
            </div>
            
            <div style="grid-column: span 2;">
                <label>Cakes</label>
                <input id="e9" min="0" type="number" placeholder="Quantity">
            </div>

            <button type="button" onclick="sss()">Total Cost</button>
            <div id="result"><h5></h5></div>

        </div>
    </form>
    
    <script src="ins.js"></script>
</body>
</html>
