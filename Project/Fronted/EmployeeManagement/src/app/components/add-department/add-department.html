
<div class="department-form-container">

  <div class="form-heading">
    <div>
      <h2>Add New Department</h2>
      <p>Create a new department in your organization.</p>
    </div>

    <div class="heading-icon">+</div>
  </div>

  <form (ngSubmit)="onSubmit()" #departmentForm="ngForm">

    <div class="form-group">

      <label for="departmentName">
        Department Name <span>*</span>
      </label>

      <input
        id="departmentName"
        type="text"
        name="departmentName"
        [(ngModel)]="departmentName"
        placeholder="Example: Human Resources"
        required
        maxlength="100"
      />

    </div>

    <div class="form-group">

      <label for="description">Description</label>

      <textarea
        id="description"
        name="description"
        [(ngModel)]="description"
        placeholder="Enter department description"
        rows="5"
        maxlength="500">
      </textarea>

    </div>

    @if (errorMessage) {
      <div class="alert error">
        {{ errorMessage }}
      </div>
    }

    @if (message) {
      <div class="alert success">
        {{ message }}
      </div>
    }

    <div class="form-actions">

      <button
        type="submit"
        class="submit-btn"
        [disabled]="departmentForm.invalid">
        + Create Department
      </button>

      <button
        type="button"
        class="reset-btn"
        (click)="departmentName = ''; description = ''; errorMessage = ''; message = ''">
        Reset
      </button>

    </div>

  </form>

</div>
